<title>워치 결정 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 결정마다 한 구역: 무엇을 정하는지, 안 셋(워치 화면, 좋은 점과 걸리는 점, 고르기, 메모). 지금 만든 화면은 시뮬레이터 캡처, 나머지는 그림. */
@font-face { font-family: 'NeoDunggeunmo'; src: url(data:font/ttf;base64,__FONT__) format('truetype'); font-display: block; }
:root {
  --mint: #AFE1CB; --lcd: #C7DE94; --coral: #FD855F; --ivory: #FEF1D1; --ink: #06261C;
  --bg: #EAF5EE; --card: #FFFFFF; --fg: #06261C; --muted: #4C6A5E; --line: #B9D6C6; --pick: #FD855F; --pick-bg: #FFF1EA;
  --pixel: 'NeoDunggeunmo', 'Apple SD Gothic Neo', system-ui, sans-serif;
  --body: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1D18; --card: #17291F; --fg: #E6F2EA; --muted: #9DBBAD; --line: #2C4A3C; --pick: #FD9B7A; --pick-bg: #2B1F1A; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0F1D18; --card: #17291F; --fg: #E6F2EA; --muted: #9DBBAD; --line: #2C4A3C; --pick: #FD9B7A; --pick-bg: #2B1F1A; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 15px/1.6 var(--body); margin: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 1120px; margin: 0 auto; padding-block: 28px 120px; display: grid; gap: 36px; }
h1, h2, h3, .code, .btn, .tag { font-family: var(--pixel); font-weight: normal; }
h1 { font-size: 28px; margin: 0; text-wrap: balance; }
h2 { font-size: 22px; margin: 0; text-wrap: balance; }
h3 { font-size: 18px; margin: 0; }
p { margin: 0; max-width: 70ch; }
.muted { color: var(--muted); }
.intro { display: grid; gap: 8px; }
.toc { display: flex; flex-wrap: wrap; gap: 8px; }
.toc a { font: 13px var(--body); color: var(--fg); text-decoration: none; padding: 3px 10px; border: 2px solid var(--line); border-radius: 99px; background: var(--card); }
.toc a.done { border-color: var(--pick); background: var(--pick-bg); }
.sec { display: grid; gap: 14px; scroll-margin-top: 16px; }
.sechead { display: grid; gap: 6px; }
.what { background: var(--card); border: 2px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; }
.what b { font-family: var(--pixel); font-weight: normal; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.opt { background: var(--card); border: 2px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.opt.ok { border-color: var(--pick); background: var(--pick-bg); }
.head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.code { font-size: 19px; }
.tag { font-size: 12px; padding: 1px 6px; border: 2px solid var(--ink); background: var(--lcd); color: var(--ink); border-radius: 3px; }
.tag.now { background: var(--ivory); }
.figs { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
figure { margin: 0; display: grid; gap: 6px; justify-items: center; }
figcaption { font-size: 12px; color: var(--muted); text-align: center; max-width: 230px; }
dl { margin: 0; display: grid; gap: 6px; font-size: 14px; }
dt { font-weight: 600; }
dd { margin: 0; }
dd ul { margin: 0; padding-left: 18px; }
.btn { font-size: 14px; padding: 6px 12px; border: 2px solid var(--ink); background: var(--ivory); color: var(--ink); border-radius: 6px; cursor: pointer; justify-self: start; }
.btn[aria-pressed="true"] { background: var(--coral); }
.btn:focus-visible, textarea:focus-visible, .toc a:focus-visible { outline: 3px dashed var(--pick); outline-offset: 2px; }
textarea { width: 100%; box-sizing: border-box; min-height: 54px; font: 14px var(--body); padding: 8px; border: 2px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); resize: vertical; }
.state { font-size: 12px; color: var(--muted); min-height: 1em; }
.secnote { display: grid; gap: 4px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--card); border-top: 2px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.bar #summary { flex: 1 1 260px; min-width: 0; }
/* Apple Watch 46mm 화면 208×248pt를 1배로 */
.watch { position: relative; width: 208px; height: 248px; padding: 10px; border-radius: 52px; background: #1c1c1e; box-shadow: inset 0 0 0 2px #3a3a3c; flex: none; }
.watch::after { content: ''; position: absolute; right: -7px; top: 62px; width: 7px; height: 30px; border-radius: 0 4px 4px 0; background: #48484a; }
.screen { width: 208px; height: 248px; border-radius: 42px; overflow: hidden; position: relative; background: var(--lcd); color: var(--ink); }
.screen.shot { background: center / 208px 248px no-repeat; }
.screen svg { display: block; image-rendering: pixelated; shape-rendering: crispEdges; }
.screen .clock { position: absolute; right: 22px; top: 12px; font: 600 15px var(--body); color: #fff; }
.pb { position: relative; border: 0; background: none; padding: 0; color: var(--ink); font: 15px var(--pixel); display: block; }
.pb .fr { position: absolute; left: 0; top: 0; overflow: visible; }
.pb .in { position: relative; display: flex; align-items: center; gap: 8px; height: calc(100% - 2px); padding: 0 12px 0 10px; box-sizing: border-box; font-size: 13px; }
.stk { width: 22px; height: 22px; flex: none; image-rendering: pixelated; }
.off { opacity: .4; }
.off .stk { filter: grayscale(1); }
.list { position: absolute; left: 0; right: 0; top: 0; padding: 14px 16px 0; display: grid; gap: 7px; justify-items: center; }
.top { height: 54px; display: flex; align-items: flex-end; justify-content: center; position: relative; }
.toast { position: absolute; left: 14px; right: 14px; bottom: 26px; font: 11px/1.35 var(--pixel); text-align: center; color: var(--ink); background: var(--ivory); border: 1.5px solid var(--ink); border-radius: 14px; padding: 5px 8px; }
.pill { position: absolute; left: 50%; transform: translateX(-50%); font: 11px var(--pixel); color: var(--ink); background: var(--ivory); border: 1.5px solid var(--ink); border-radius: 99px; padding: 1px 8px; white-space: nowrap; }
.mid { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 14px; text-align: center; padding: 0 16px; font: 13px/1.45 var(--pixel); }
.gt { position: absolute; left: 56px; right: 56px; top: 18px; text-align: center; font: 15px var(--pixel); }
.backb { position: absolute; left: 20px; top: 12px; }
/* 블록 색 표 */
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.sw { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); background: var(--bg); border-radius: 6px; padding: 4px 6px; min-width: 0; }
.sw img { width: 26px; height: 26px; image-rendering: pixelated; flex: none; }
.sw i { width: 22px; height: 14px; border: 2px solid var(--ink); flex: none; }
.sw span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 아이콘 */
.icons { display: flex; gap: 16px; align-items: center; justify-content: center; flex-wrap: wrap; }
.ic { border-radius: 50%; overflow: hidden; display: grid; place-items: center; box-shadow: 0 0 0 2px #3a3a3c; }
.ic img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
/* 시계 화면 */
.face { position: absolute; inset: 0; background: #000; color: #fff; }
.face .t { position: absolute; left: 0; right: 0; top: 54px; text-align: center; font: 300 62px/1 var(--body); letter-spacing: -1px; }
.face .d { position: absolute; left: 0; right: 0; top: 30px; text-align: center; font: 600 13px var(--body); color: #FD9B7A; }
.cmp { position: absolute; display: grid; place-items: center; background: #1f2a24; overflow: hidden; }
.cmp.circle { width: 58px; height: 58px; border-radius: 50%; }
.cmp.rect { height: 50px; border-radius: 14px; grid-template-columns: auto 1fr; gap: 6px; padding: 0 10px; justify-items: start; font: 11px/1.3 var(--pixel); color: var(--lcd); }
.cmp.other { width: 44px; height: 44px; border-radius: 50%; background: #1c1c1e; font: 600 11px var(--body); color: #8ad; }
/* 오늘 칸 */
.marks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; }
.mk { display: grid; gap: 4px; justify-items: center; font-size: 11px; color: var(--muted); text-align: center; }
.mk .bx { background: var(--lcd); border-radius: 8px; padding: 8px; display: grid; place-items: center; }
.cell { width: 30px; height: 30px; box-sizing: border-box; display: grid; place-items: center; font: 11px var(--pixel); color: var(--ink); }
.cell.brk { background:
  linear-gradient(var(--ink), var(--ink)) left top / 9px 3px, linear-gradient(var(--ink), var(--ink)) left top / 3px 9px,
  linear-gradient(var(--ink), var(--ink)) right top / 9px 3px, linear-gradient(var(--ink), var(--ink)) right top / 3px 9px,
  linear-gradient(var(--ink), var(--ink)) left bottom / 9px 3px, linear-gradient(var(--ink), var(--ink)) left bottom / 3px 9px,
  linear-gradient(var(--ink), var(--ink)) right bottom / 9px 3px, linear-gradient(var(--ink), var(--ink)) right bottom / 3px 9px; background-repeat: no-repeat; }
.cell.apr { border: 2px solid var(--coral); }
.cell.sm { width: 22px; height: 22px; font-size: 9px; }
.cell.sm.brk { background-size: 7px 2px, 2px 7px, 7px 2px, 2px 7px, 7px 2px, 2px 7px, 7px 2px, 2px 7px; }
@media (prefers-reduced-motion: no-preference) { .fall { animation: fall 1.6s ease-in infinite; } }
@keyframes fall { 0% { transform: translateY(-40px); opacity: 0 } 15% { opacity: 1 } 55%, 100% { transform: translateY(0); opacity: 1 } }
@media (max-width: 420px) { .marks { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>

<main>
  <div class="intro">
    <h1>워치에서 정할 것</h1>
    <p>워치 계획 2를 만들면서 생긴 결정 일곱 가지예요. 안마다 <b>지금 만든 것</b>(시뮬레이터에서 찍은 실제 화면)과 다른 안을 나란히 두었어요. 하나씩 고르고, 고칠 점은 메모로 남겨 주세요. 고른 안과 메모는 저장되어 제가 읽을 수 있어요.</p>
    <p class="muted">「지금 만든 것」 표시는 이미 코드에 들어간 안이에요. 「추천」은 제가 고른다면 고를 안이에요. 둘이 다를 수 있어요.</p>
    <nav class="toc" id="toc" aria-label="결정 목록"></nav>
  </div>
  <div id="secs" style="display:grid;gap:44px"></div>
  <section class="sec" id="sec-all">
    <h2>그 밖에</h2>
    <p class="muted">여기 없는 결정이나 시안 전체에 대한 메모를 적어 주세요.</p>
    <textarea id="note-wd-all" data-k="note-wd-all" aria-label="전체 메모" placeholder="전체 메모"></textarea>
    <span class="state" id="state-note-wd-all"></span>
  </section>
</main>
<div class="bar">
  <span id="summary">아직 고른 안이 없어요</span>
  <span id="store-state" class="muted">저장소 연결 중…</span>
  <button type="button" class="btn" id="copy">메모까지 복사</button>
</div>

<script>
const CH = __CHAR__;
const STK = __STICKERS__;      // 스티커 id → PNG data URI (assets/widget-art, 위젯과 워치가 쓰는 그림)
const AREA = __AREA__;         // 지금 블록 색(src/watch/stickerColors.generated.ts)
const VIVID = __VIVID__;       // 다른 안: 채도가 가장 높은 색
const IMG = __IMG__;           // 앱 아이콘, 시뮬레이터 캡처
const COL = {'#': '#06261C', g: '#C7DE94', o: '#FD855F', w: '#FEF1D1', m: '#AFE1CB'};
const INK = '#06261C', APRICOT = '#FD855F', IVORY = '#FEF1D1', MINT = '#AFE1CB';
const FALLBACK = ['#AFE1CB', '#FEF1D1', '#FD855F'];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

// ---- 픽셀 그림 (시안 14판과 같은 방식) ----
function Pix() { const m = new Map(); return {
  put(x, y, c) { if (c && c !== '.') m.set(x + ',' + y, c); },
  grid(rows, ox, oy) { rows.forEach((r, y) => [...r].forEach((c, x) => this.put(ox + x, oy + y, c))); },
  rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.put(x + i, y + j, c); },
  svg(cell, box) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const k of m.keys()) { const [x, y] = k.split(',').map(Number); x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    if (box) [x0, y0, x1, y1] = box;
    if (x0 === Infinity) return '';
    const w = x1 - x0 + 1, h = y1 - y0 + 1; let out = '';
    for (const [k, c] of m) { const [x, y] = k.split(',').map(Number); if (x < x0 || x > x1 || y < y0 || y > y1) continue; out += `<rect x="${x - x0}" y="${y - y0}" width="1.02" height="1.02" fill="${COL[c] || c}"/>`; }
    return `<svg width="${w * cell}" height="${h * cell}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${out}</svg>`;
  }}; }
const BX = [8, 9, 7];
function block(p, x, y, c) { p.rect(x, y, 8, 4, '#'); p.rect(x + 1, y + 1, 6, 2, c); }
function chagok(face, heads, cell = 2.4) {
  const p = Pix(), oy = 12;
  if (!heads.length) p.grid(CH.blockStates.b0.slice(10, 12), 0, oy - 2);
  p.grid(CH.faces[face].slice(12, 23), 0, oy);
  heads.forEach((c, i) => block(p, BX[i % 3], oy - 4 - 3 * i, c));
  return p.svg(cell, [0, 2, 23, 22]);
}
function blockSvg(c, cell = 2.4) { const p = Pix(); block(p, 0, 0, c); return p.svg(cell); }

// ---- 앱 PixelButton 틀 ----
function outline(w, h, inset = 0, unit = 3) {
  const x = inset, y = inset, r = w - inset, b = h - inset; if (r <= x || b <= y) return '';
  const u = Math.min(unit, (r - x) / 4, (b - y) / 4);
  return `M${x + 2 * u} ${y} H${r - 2 * u} V${y + u} H${r - u} V${y + 2 * u} H${r} V${b - 2 * u} H${r - u} V${b - u} H${r - 2 * u} V${b} H${x + 2 * u} V${b - u} H${x + u} V${b - 2 * u} H${x} V${y + 2 * u} H${x + u} V${y + u} H${x + 2 * u} Z`;
}
function frame(w, h, fill, unit = 5) {
  const border = 3, depth = 2, W = w - 1, H = h - depth, d = outline(W, H, border / 2, unit);
  return `<svg class="fr" width="${w}" height="${h}" aria-hidden="true"><path d="${d}" fill="${INK}" stroke="${INK}" stroke-width="${border}" transform="translate(1,${depth})"/><path d="${d}" fill="${fill}" stroke="${INK}" stroke-width="${border}"/><path d="M${2 * unit + border + 2} ${border + 2} H${W - 2 * unit - border - 2} M${border + 2} ${2 * unit + border + 2} V${H - 2 * unit - border - 2}" stroke="${IVORY}" stroke-width="2"/></svg>`;
}
const row = (g, {cls = ''} = {}) => `<div class="pb ${cls}" style="width:176px;height:40px">${frame(176, 40, g.today ? MINT : IVORY)}<span class="in"><img class="stk" src="${STK[g.s]}" alt="">${esc(g.name)}</span></div>`;
const CHEV = (() => { const p = Pix(); p.grid(['...##', '..##.', '.##..', '##...', '.##..', '..##.', '...##'], 0, 0); return p.svg(2); })();
const back = `<span class="backb"><div class="pb" style="width:30px;height:30px">${frame(30, 30, IVORY, 2)}<span class="in" style="padding:0;justify-content:center">${CHEV}</span></div></span>`;
const clock = '<span class="clock">9:41</span>';
const watch = inner => `<div class="watch"><div class="screen">${inner}${clock}</div></div>`;
const shot = key => `<div class="watch"><div class="screen shot" style="background-image:url(${IMG[key]})"></div></div>`;
const fig = (w, cap) => `<figure>${w}<figcaption>${cap}</figcaption></figure>`;

const GOALS = [
  {name: '산책', s: 'basic.shoe', today: true}, {name: '물 마시기', s: 'basic.star'},
  {name: '일기 쓰기', s: 'basic.flower'}, {name: '동물 그리기', s: 'animals_normal.cat', locked: true},
];
const heads2 = [AREA['basic.star'], AREA['basic.shoe']];
function home({goals = GOALS, face = 'smile', heads = heads2, top = '', extra = ''} = {}) {
  return `<div class="list"><div class="top">${chagok(face, heads)}${top}</div>${goals.map(g => row(g, {cls: g.locked && g.dim ? 'off' : ''})).join('')}</div>${extra}`;
}

// ---- 결정 ----
const SECS = [
  {id: '1', title: '체험이 끝난 목표', what: '유료 스티커 묶음은 붙인 날이 쌓이면 3일 써 볼 수 있어요. 그 묶음 스티커를 기본 스티커로 고른 목표는 체험이 끝나면 더 붙일 수 없어요. 폰에서는 「n일 체험이 끝났어요」와 [다른 스티커] [묶음 열기]를 보여요. 워치는 그 화면을 띄울 수 없어서 어떻게 보일지 정해야 해요.', opts: [
    {id: 'a', code: 'L1', title: '목록 그대로, 누르면 안내', now: true,
      figs: () => [fig(watch(home()), '목록은 평소와 같아요'), fig(watch(`${back}<span class="gt">동물 그리기</span><div class="mid" style="padding-top:20px">${chagok('basic', [])}</div><div class="toast">체험이 끝났어요. 폰에서 다른 스티커를 고를 수 있어요</div>`), '[붙이기]를 누르면 안내가 잠깐 떠요')],
      pro: ['다른 목표와 똑같이 보여서 헷갈리지 않아요.', '판은 열어 볼 수 있고, 오늘 붙인 칸은 뗄 수 있어요.'], con: ['눌러 보기 전에는 붙일 수 없다는 걸 몰라요.']},
    {id: 'b', code: 'L2', title: '흐리게 두고, 누르면 안내', rec: true,
      figs: () => [fig(watch(home({goals: GOALS.map(g => g.locked ? {...g, dim: true} : g)})), '체험이 끝난 목표는 흐려요'), fig(watch(home({goals: GOALS.map(g => g.locked ? {...g, dim: true} : g), extra: '<div class="toast">체험이 끝났어요. 폰에서 다른 스티커를 고를 수 있어요</div>'})), '누르면 판 대신 안내가 떠요')],
      pro: ['목록만 봐도 지금 붙일 수 없는 목표를 알아요.', '목표가 사라지지 않아서 「어디 갔지?」 하지 않아요.'], con: ['워치에서 그 목표의 판을 열어 볼 수 없어요.']},
    {id: 'c', code: 'L3', title: '목록에서 빼기',
      figs: () => [fig(watch(home({goals: GOALS.filter(g => !g.locked)})), '붙일 수 있는 목표만 보여요')],
      pro: ['워치에는 지금 붙일 수 있는 것만 있어 가장 단순해요.'], con: ['폰에는 있는 목표가 워치에서 말없이 사라져요.', '스티커를 바꾸면 다시 나타나서 헷갈릴 수 있어요.']},

      if (m) { if (typeof v.value === 'string') state.picks[m[1]] = v.value; continue; }
      if (!/^note-wd-(all|\d(-[abc])?)$/.test(d.id)) continue;
      const t = document.activeElement; state.notes[d.id] = t && t.dataset && t.dataset.k === d.id ? t.value : String(v.note || '');
    }
    saveLocal(); paint();
  }, () => { $('store-state').textContent = '저장소 연결이 끊겼어요. 메모까지 복사로 보내 주세요'; });
})();
</script>
