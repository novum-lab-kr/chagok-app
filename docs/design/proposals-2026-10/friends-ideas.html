<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>친구와 함께 쓰기 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 아이디어마다 폰 화면 그림 한 장과 한 줄 설명, 고르기, 메모. 맨 아래에 방향 셋 중 하나 고르기. */
@font-face { font-family: 'NeoDunggeunmo'; src: url(../../../src/design-system/assets/neodgm-1.601.ttf) format('truetype'); font-display: block; }
:root {
  --mint: #AFE1CB; --lcd: #C7DE94; --coral: #FD855F; --ivory: #FEF1D1; --ink: #06261C;
  --bg: #EAF5EE; --card: #FFFFFF; --fg: #06261C; --muted: #4C6A5E; --line: #B9D6C6; --pick: #FD855F; --pick-bg: #FFF1EA; --no-bg: #EEF0EE;
  --pixel: 'NeoDunggeunmo', 'Apple SD Gothic Neo', system-ui, sans-serif;
  --body: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1D18; --card: #17291F; --fg: #E6F2EA; --muted: #9DBBAD; --line: #2C4A3C; --pick: #FD9B7A; --pick-bg: #2B1F1A; --no-bg: #1B2420; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0F1D18; --card: #17291F; --fg: #E6F2EA; --muted: #9DBBAD; --line: #2C4A3C; --pick: #FD9B7A; --pick-bg: #2B1F1A; --no-bg: #1B2420; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 15px/1.6 var(--body); margin: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 1180px; margin: 0 auto; padding-block: 28px 130px; display: grid; gap: 40px; }
h1, h2, h3, .btn, .gl { font-family: var(--pixel); font-weight: normal; }
h1 { font-size: 28px; margin: 0; }
h2 { font-size: 22px; margin: 0; text-wrap: balance; }
h3 { font-size: 18px; margin: 0; }
p { margin: 0; max-width: 62ch; }
.muted { color: var(--muted); }
.intro { display: grid; gap: 6px; }
.group { display: grid; gap: 16px; }
.gl { font-size: 13px; color: var(--muted); letter-spacing: .04em; }
.ideas { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.idea { background: var(--card); border: 2px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.idea.yes { border-color: var(--pick); background: var(--pick-bg); }
.idea.no .ph { opacity: .45; }
.idea .line { font-size: 14px; min-height: 3.2em; }
.num { font: 13px var(--pixel); color: var(--muted); }
.picks { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { font-size: 14px; padding: 5px 11px; border: 2px solid var(--ink); background: var(--ivory); color: var(--ink); border-radius: 6px; cursor: pointer; }
.btn[aria-pressed="true"] { background: var(--coral); }
.btn.no[aria-pressed="true"] { background: #9AA59F; }
.btn:focus-visible, textarea:focus-visible { outline: 3px dashed var(--pick); outline-offset: 2px; }
textarea { width: 100%; box-sizing: border-box; min-height: 48px; font: 14px var(--body); padding: 8px; border: 2px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); resize: vertical; }
.state { font-size: 12px; color: var(--muted); min-height: 1em; }

/* 폰 화면 그림. 앱 화면 390pt를 0.66배로 */
.ph { width: 258px; max-width: 100%; height: 470px; box-sizing: border-box; border: 3px solid var(--ink); border-radius: 30px; background: var(--mint); color: var(--ink); overflow: hidden; position: relative; justify-self: center; font: 13px/1.45 var(--pixel); }
.scr { position: absolute; inset: 0; padding: 30px 14px 14px; display: grid; gap: 10px; align-content: start; }
.tt { font-size: 18px; line-height: 1.3; }
.cap { font-size: 11px; color: #2F5446; }
.pn { background: var(--lcd); border: 2px solid var(--ink); border-radius: 3px; padding: 8px; display: grid; gap: 7px; }
.row { display: flex; align-items: center; gap: 7px; min-width: 0; }
.row .grow { flex: 1; min-width: 0; }
.s { display: block; flex: none; image-rendering: pixelated; shape-rendering: crispEdges; }
.who { display: grid; justify-items: center; gap: 2px; font-size: 11px; }
.dlg { background: var(--ivory); border: 2px solid var(--ink); border-radius: 4px; padding: 14px 12px; display: grid; gap: 10px; justify-items: center; text-align: center; }
.pbtn { width: 100%; box-sizing: border-box; text-align: center; padding: 7px 0; border: 2px solid var(--ink); border-radius: 4px; background: var(--coral); color: #01241C; font-size: 13px; }
.pbtn.sec { background: var(--ivory); }
.bdg { display: inline-block; font-size: 10px; padding: 0 5px; background: var(--ink); color: var(--lcd); border-radius: 2px; }
.bdg.done { background: var(--coral); color: #01241C; }
.grid { display: grid; gap: 3px; }
.cell { aspect-ratio: 1; background: var(--ivory); border: 2px solid var(--ink); border-radius: 2px; display: grid; place-items: center; box-sizing: border-box; }
.cell.empty { background: transparent; border-color: #5E8F75; }
.cell.next { border-color: transparent; background:
  linear-gradient(var(--ink), var(--ink)) left top / 8px 2px, linear-gradient(var(--ink), var(--ink)) left top / 2px 8px,
  linear-gradient(var(--ink), var(--ink)) right top / 8px 2px, linear-gradient(var(--ink), var(--ink)) right top / 2px 8px,
  linear-gradient(var(--ink), var(--ink)) left bottom / 8px 2px, linear-gradient(var(--ink), var(--ink)) left bottom / 2px 8px,
  linear-gradient(var(--ink), var(--ink)) right bottom / 8px 2px, linear-gradient(var(--ink), var(--ink)) right bottom / 2px 8px; background-repeat: no-repeat; }
.tabbar { position: absolute; left: 12px; right: 12px; bottom: 12px; height: 38px; background: var(--ivory); border: 2px solid var(--ink); border-radius: 4px; display: flex; justify-content: space-around; align-items: center; }
.tabbar i { width: 18px; height: 18px; background: var(--ink); opacity: .35; border-radius: 2px; }
.tabbar i.on { background: var(--coral); opacity: 1; }
.photo { height: 170px; border: 2px solid var(--ink); border-radius: 3px; position: relative; overflow: hidden;
  background: linear-gradient(#FDE7B8 0 55%, #7DBE5A 55% 100%); }
.photo .hill { position: absolute; left: -20px; right: 60px; bottom: 30%; height: 60px; background: #4E8A3E; clip-path: polygon(0 100%, 30% 20%, 55% 70%, 80% 0, 100% 100%); }
.photo .river { position: absolute; left: 0; right: 0; bottom: 12%; height: 14px; background: #7FC4E8; }
.dots { display: flex; gap: 4px; justify-content: center; }
.dots i { width: 8px; height: 8px; background: var(--ink); opacity: .25; }
.dots i.on { opacity: 1; }
.card { background: var(--ivory); border: 2px solid var(--ink); border-radius: 4px; padding: 12px; display: grid; gap: 8px; transform: rotate(-3deg); box-shadow: 4px 4px 0 var(--ink); }
.wall { background: linear-gradient(160deg, #2F4F63, #1B2B38); }
.apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 10px; padding: 0 4px; }
.apps i { aspect-ratio: 1; border-radius: 12px; background: rgba(255,255,255,.22); }
.wg { grid-column: span 2; grid-row: span 2; aspect-ratio: 1; border-radius: 18px; background: var(--lcd); border: 2px solid var(--ink); padding: 10px; box-sizing: border-box; display: grid; align-content: space-between; color: var(--ink); font: 11px/1.35 var(--pixel); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--ivory); border-top: 2px solid var(--ink); padding: 12px 14px 18px; display: grid; gap: 10px; }

/* 넣지 않을 것 */
.nots { display: flex; gap: 12px; flex-wrap: wrap; }
.notc { position: relative; background: var(--no-bg); border: 2px dashed var(--line); border-radius: 8px; padding: 10px 14px; font: 14px var(--pixel); color: var(--muted); }
.notc::after { content: ''; position: absolute; left: 8px; right: 8px; top: 50%; height: 2px; background: var(--pick); transform: rotate(-6deg); }

/* 방향 */
.dirs { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.dir { background: var(--card); border: 2px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; align-content: start; }
.dir.yes { border-color: var(--pick); background: var(--pick-bg); }
.dir .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.tag { font: 12px var(--pixel); padding: 1px 6px; border: 2px solid var(--ink); background: var(--lcd); color: var(--ink); border-radius: 3px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 13px; padding: 2px 9px; border-radius: 99px; border: 2px solid var(--line); background: var(--bg); }
.meter { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; align-items: center; }
.bars { display: flex; gap: 3px; }
.bars i { width: 18px; height: 10px; border: 2px solid var(--fg); border-radius: 2px; }
.bars i.on { background: var(--coral); }

.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--card); border-top: 2px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.bar #summary { flex: 1 1 260px; min-width: 0; }
</style>

<main>
  <div class="intro">
    <h1>친구와 함께 쓰기</h1>
    <p>아이디어 일곱 개를 화면 그림으로 그렸어요. 마음에 들면 「넣고 싶어요」, 아니면 「빼요」를 눌러 주세요.</p>
    <p class="muted">설명용으로 그린 그림이에요. 실제 컴포넌트를 찍은 화면은 아니에요. 스티커와 차곡이는 앱 그림 그대로예요.</p>
  </div>
  <div id="groups" style="display:grid;gap:40px"></div>

  <section class="group">
    <span class="gl">넣지 않을 것</span>
    <div class="nots">
      <span class="notc">이번 주 1등은 지우</span>
      <span class="notc">사진을 확인해 주세요</span>
      <span class="notc">방 연속 12일째</span>
      <span class="notc">지우는 붙였어요, 나는?</span>
    </div>
    <p class="muted" style="font-size:14px">순위, 인증 확인, 연속일수, 재촉은 친구 기능에도 넣지 않아요(PRD 2절).</p>
  </section>

  <section class="group">
    <h2>어디까지 만들까요</h2>
    <div class="dirs" id="dirs"></div>
    <textarea id="note-fr-dir" data-k="note-fr-dir" aria-label="방향 메모" placeholder="방향 메모"></textarea>
    <span class="state" id="state-note-fr-dir"></span><span class="state" id="state-choice-fr-dir"></span>
  </section>

  <section class="group">
    <h2>그 밖에</h2>
    <textarea id="note-fr-all" data-k="note-fr-all" aria-label="전체 메모" placeholder="여기 없는 아이디어나 전체 메모"></textarea>
    <span class="state" id="state-note-fr-all"></span>
  </section>
</main>
<div class="bar">
  <span id="summary">아직 고른 게 없어요</span>
  <span id="store-state" class="muted">저장소 연결 중…</span>
  <button type="button" class="btn" id="copy">메모까지 복사</button>
</div>

      ${[[JIWOO, '지우'], [MINHO, '민호'], [SEOYEON, '서연'], [ME, '나']].map(([s, n]) => `<div class="who">${S(s, 30)}${n}</div>`).join('')}
    </div>
    <div class="pn">
      <span class="cap">오늘 붙인 스티커</span>
      ${[[JIWOO, '지우', '아침 달리기', 'sports_normal.run', '방금'], [MINHO, '민호', '책 20쪽', 'basic.book', '1시간 전'], [SEOYEON, '서연', '물 여덟 잔', 'snack_normal.milk', '3시간 전'], [ME, '나', '아침 달리기', 'sports_normal.run', '어제']]
        .map(([a, n, g, s, t]) => `<div class="row">${S(a, 22)}<div class="grow"><div>${n}</div><div class="cap">${g}</div></div>${S(s, 24)}<span class="cap" style="width:44px;text-align:right">${t}</span></div>`).join('')}
    </div>
    <div class="pbtn sec">친구 초대 링크 보내기</div>
  </div>${tabs(2)}`),

  together: () => {
    const who = [JIWOO, ME, MINHO, JIWOO, JIWOO, MINHO, ME, ME, JIWOO, MINHO, ME, JIWOO, MINHO, MINHO, ME, JIWOO, ME];
    const cells = [...who, 'next', ...Array(30 - who.length - 1).fill('')];
    return ph(`<div class="scr">
      <div class="tt">이번 달 같이 걷기</div>
      <div class="row"><span class="bdg">함께 채우는 판</span><span class="cap">17 / 30</span></div>
      <div class="pn">${board(5, cells, 26)}</div>
      <div class="row" style="justify-content:center;gap:14px">${[[JIWOO, '지우'], [MINHO, '민호'], [ME, '나']].map(([s, n]) => `<div class="row" style="gap:4px">${S(s, 18)}<span class="cap">${n}</span></div>`).join('')}</div>
      <span class="cap" style="text-align:center">누가 몇 개 붙였는지는 세지 않아요</span>
    </div>`);
  },

  invite: () => ph(`<div class="scr" style="align-content:center;height:100%;box-sizing:border-box">
    <div class="dlg">
      ${F('sparkle', 56)}
      <div>지우가 목표를 보냈어요</div>
      <div class="pn" style="width:100%;box-sizing:border-box;text-align:left">
        <div class="row">${S('sports_normal.walk', 36)}<div class="grow"><div>하루 만 보 걷기</div><span class="bdg">적립판 30칸</span></div></div>
      </div>
      <span class="cap">내 판으로 시작해요. 그다음은 각자 채워요.</span>
      <div class="pbtn">내 판으로 시작하기</div>
      <div class="pbtn sec">다음에</div>
    </div>
  </div>`),

  recap: () => ph(`<div class="scr">
    <div class="tt">10월 우리 판 돌아보기</div>
    <div class="photo"><div class="hill"></div><div class="river"></div>${S('weather_normal.sun', 36, 'position:absolute;right:16px;top:12px')}</div>
    <div class="pn">
      <div class="row">${S(MINHO, 22)}<span>민호</span><span class="cap">10월 12일</span>${S('sports_normal.run', 22, 'margin-left:auto')}</div>
      <div>처음으로 한강까지 뛰었다</div>
    </div>
    <div class="dots">${Array.from({length: 9}, (_, i) => `<i class="${i === 3 ? 'on' : ''}"></i>`).join('')}</div>
    <span class="cap" style="text-align:center">넘기면 다음 기록</span>
  </div>`),

  postcard: () => ph(`<div class="scr" style="gap:18px">
    <div class="tt">완성한 판</div>
    <div class="card">
      <div class="row"><span class="grow">책 30권 읽기</span><span class="bdg done">완성</span></div>
      ${board(6, Array(30).fill('basic.book'), 18)}
      <div class="row"><span class="cap grow">2026년 10월</span>${F('excited', 28)}</div>
    </div>
    <div style="display:grid;gap:8px;margin-top:8px">
      <div class="pbtn">엽서로 보내기</div>
      <span class="cap" style="text-align:center">받는 사람은 앱이 없어도 그림으로 봐요</span>
    </div>
  </div>`),

  cheer: () => {
    const cells = [...Array(9).fill(ME), 'next', ...Array(6).fill('')];
    return ph(`<div class="scr">
      <div class="tt">하루 한 장 그리기</div>
      <div style="position:relative;padding:18px 14px">
        <div class="pn">${board(4, cells, 30)}</div>
        ${S('emotions_normal.love', 26, 'position:absolute;left:0;top:2px;transform:rotate(-14deg)')}
        ${S('basic.star', 24, 'position:absolute;right:2px;top:40%;transform:rotate(12deg)')}
        ${S('weather_normal.sun', 24, 'position:absolute;left:30%;bottom:0;transform:rotate(-8deg)')}
      </div>
      <span class="cap" style="text-align:center">친구 스티커는 칸 바깥에만 붙어요</span>
    </div>
    <div class="sheet">
      <div>지우에게 응원 붙이기</div>
      <div class="row" style="justify-content:space-around">${['emotions_normal.love', 'basic.star', 'weather_normal.sun', 'basic.flower'].map(s => `<div class="cell" style="width:46px">${S(s, 30)}</div>`).join('')}</div>
    </div>`);
  },

  widget: () => ph(`<div class="scr" style="padding-top:44px;gap:18px">
    <div class="apps">
      <div class="wg">
        <div class="row" style="gap:5px">${S(JIWOO, 22)}<span>지우</span></div>
        <div style="display:grid;justify-items:center">${S('sports_normal.run', 44)}</div>
        <div>아침 달리기에<br>붙였어요</div>
      </div>
      <i></i><i></i><i></i><i></i>
      <i></i><i></i><i></i><i></i>
    </div>
  </div>`, 'wall'),
};

const GROUPS = [
  {label: '같이 쌓기', ids: [1, 2, 3]},
  {label: '함께 돌아보기', ids: [4, 5]},
  {label: '가벼운 반응', ids: [6, 7]},
];
const IDEAS = {
  1: {title: '친구 방', line: '2~6명이 링크로 모여요. 목표와 판은 각자 채우고, 붙인 소식만 같이 봐요.', screen: 'room'},
  2: {title: '함께 채우는 판', line: '판 하나를 여럿이 채워요. 누가 붙였는지는 보이지만 개수는 세지 않아요.', screen: 'together'},
  3: {title: '같이 시작하기', line: '친구가 보낸 목표를 내 판으로 시작해요.', screen: 'invite'},
  4: {title: '우리 판 돌아보기', line: '한 달이 끝나면 방 사람들의 사진과 메모를 넘겨 봐요.', screen: 'recap'},
  5: {title: '완성한 판 엽서', line: '다 채운 판을 그림으로 보내요.', screen: 'postcard'},
  6: {title: '응원 스티커', line: '친구는 판 바깥 여백에만, 글 없이 모양만 붙여요.', screen: 'cheer'},
  7: {title: '위젯에 친구 소식', line: '친구가 방금 붙인 스티커가 내 위젯에 떠요.', screen: 'widget'},
};
const PICKS = [['yes', '넣고 싶어요'], ['later', '나중에'], ['no', '빼요']];

const DIRS = [
  {id: 'a', code: 'A', title: '혼자 쓰고 보내기만', rec: true, ideas: [5, 3], cost: 1,
    what: '서버, 신고 기능, 약관 변경 없이 바로 만들 수 있어요. 지금 원칙을 그대로 지켜요.'},
  {id: 'b', code: 'B', title: '작은 친구 방', ideas: [1, 4, 6, 7], cost: 3,
    what: '셋로그에 가장 가까워요. 신고와 차단, 처리방침 수정, PRD 2절 다시 쓰기가 따라와요.'},
  {id: 'c', code: 'C', title: '함께 채우는 판 하나', ideas: [2, 3], cost: 2,
    what: '가족이나 커플처럼 아주 작은 그룹용이에요. 차곡차곡다운 색이 가장 뚜렷해요.'},
];

$('groups').innerHTML = GROUPS.map(g => `<section class="group"><span class="gl">${esc(g.label)}</span><div class="ideas">${g.ids.map(n => {
  const it = IDEAS[n];
  return `<article class="idea" id="card-${n}">
    <div><span class="num">${n}</span> <h3 style="display:inline">${esc(it.title)}</h3></div>
    ${SCREENS[it.screen]()}
    <p class="line">${esc(it.line)}</p>
    <div class="picks">${PICKS.map(([v, l]) => `<button type="button" class="btn ${v}" data-idea="${n}" data-v="${v}" aria-pressed="false">${l}</button>`).join('')}</div>
    <textarea id="note-fr-${n}" data-k="note-fr-${n}" aria-label="${esc(it.title)} 메모" placeholder="${esc(it.title)} 메모"></textarea>
    <span class="state" id="state-note-fr-${n}"></span><span class="state" id="state-choice-fr-${n}"></span>
  </article>`;
}).join('')}</div></section>`).join('');

$('dirs').innerHTML = DIRS.map(d => `<article class="dir" id="dir-${d.id}">
  <div class="head"><h3>${d.code}. ${esc(d.title)}</h3>${d.rec ? '<span class="tag">추천</span>' : ''}</div>
  <div class="chips">${d.ideas.map(n => `<span class="chip">${n} ${esc(IDEAS[n].title)}</span>`).join('')}</div>
  <div class="meter"><span>만드는 양</span><span class="bars">${[1, 2, 3].map(i => `<i class="${i <= d.cost ? 'on' : ''}"></i>`).join('')}</span></div>
  <p style="font-size:14px">${esc(d.what)}</p>
  <button type="button" class="btn" data-dir="${d.id}" aria-pressed="false" style="justify-self:start">${d.code}로 하기</button>
</article>`).join('');

// ---- 고르기와 메모 저장 (db review/choice-fr-<n|dir>, review/note-fr-<n|dir|all>) ----
const state = {picks: {}, notes: {}};
const LS = 'chagok-friends-ideas-1';
try { const l = JSON.parse(localStorage.getItem(LS) || '{}'); Object.assign(state.picks, l.picks || {}); Object.assign(state.notes, l.notes || {}); } catch (e) {}
let db = null; const writing = {}, queued = {}, timers = {};
function paint() {
  for (const n of Object.keys(IDEAS)) {
    const v = state.picks[n] || '';
    $(`card-${n}`).classList.toggle('yes', v === 'yes');
    $(`card-${n}`).classList.toggle('no', v === 'no');
    for (const b of document.querySelectorAll(`[data-idea="${n}"]`)) b.setAttribute('aria-pressed', String(b.dataset.v === v));
  }
  for (const d of DIRS) {
    const on = state.picks.dir === d.id;
    $(`dir-${d.id}`).classList.toggle('yes', on);
    document.querySelector(`[data-dir="${d.id}"]`).setAttribute('aria-pressed', String(on));
  }
  for (const t of document.querySelectorAll('textarea[data-k]')) { const x = state.notes[t.dataset.k] || ''; if (document.activeElement !== t && t.value !== x) t.value = x; }
  const yes = Object.keys(IDEAS).filter(n => state.picks[n] === 'yes');
  const d = DIRS.find(x => x.id === state.picks.dir);
  const n = Object.values(state.notes).filter(x => x && x.trim()).length;
  const parts = [];
  if (yes.length) parts.push(`넣고 싶어요: ${yes.join(', ')}번`);
  if (d) parts.push(`방향 ${d.code}`);
  if (n) parts.push(`메모 ${n}개`);
  $('summary').textContent = parts.length ? parts.join(', ') : '아직 고른 게 없어요';
}
function setStatus(k, t) { const el = $(`state-${k}`); if (el) el.textContent = t; }
function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }
async function persist(k) {
  saveLocal();
  if (!db) { setStatus(k, '이 브라우저에만 저장됐어요'); return; }
  if (writing[k]) { queued[k] = true; return; }
  writing[k] = true; setStatus(k, '저장 중…');
  const at = new Date().toISOString();
  try {
    const m = k.match(/^choice-fr-(\w+)$/);
    await db.doc(`review/${k}`).set(m ? {value: state.picks[m[1]] || '', updatedAt: at} : {note: state.notes[k] || '', updatedAt: at});
    setStatus(k, m ? '고른 것을 저장했어요' : '저장했어요');
  } catch (e) { setStatus(k, '저장하지 못했어요. 메모까지 복사로 보내 주세요'); }
  finally { writing[k] = false; if (queued[k]) { queued[k] = false; persist(k); } }
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-idea],[data-dir]'); if (!b) return;
  if (b.dataset.idea) { const n = b.dataset.idea; state.picks[n] = state.picks[n] === b.dataset.v ? '' : b.dataset.v; paint(); persist(`choice-fr-${n}`); }
  else { state.picks.dir = state.picks.dir === b.dataset.dir ? '' : b.dataset.dir; paint(); persist('choice-fr-dir'); }
});
document.addEventListener('input', e => {
  const t = e.target.closest('textarea[data-k]'); if (!t) return;
  const k = t.dataset.k; state.notes[k] = t.value; setStatus(k, '적는 중…'); paint();
  clearTimeout(timers[k]); timers[k] = setTimeout(() => persist(k), 800);
});
$('copy').addEventListener('click', () => {
  const label = {yes: '넣고 싶어요', later: '나중에', no: '빼요'};
  const lines = Object.entries(IDEAS).map(([n, it]) => `${n}. ${it.title}: ${label[state.picks[n]] || '아직'}`);
  const d = DIRS.find(x => x.id === state.picks.dir);
  const text = '친구와 함께 쓰기 시안\n' + lines.join('\n') + `\n방향: ${d ? d.code + ' ' + d.title : '아직'}\n` + Object.entries(state.notes).filter(([, v]) => v && v.trim()).map(([k, v]) => `${k}: ${v.trim()}`).join('\n');
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($('summary')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); };
  try { navigator.clipboard.writeText(text).then(() => { $('copy').textContent = '복사했어요'; setTimeout(() => { $('copy').textContent = '메모까지 복사'; }, 1500); }, fallback); } catch (err) { fallback(); }
});
paint();
(async () => {
  const got = window.claude && window.claude.use ? await window.claude.use('db').catch(() => null) : null;
  if (!got) { $('store-state').textContent = '이 브라우저에만 저장돼요. 메모까지 복사로 보내 주세요'; return; }
  db = got; $('store-state').textContent = 'Claude가 읽을 수 있게 저장돼요';
  db.collection('review').onSnapshot(snap => {
    for (const d of snap.docs) {
      const v = d.data(); if (!v || writing[d.id]) continue;
      const m = d.id.match(/^choice-fr-(\w+)$/);
      if (m) { if (typeof v.value === 'string') state.picks[m[1]] = v.value; continue; }
      if (!/^note-fr-(all|dir|\d)$/.test(d.id)) continue;
      const t = document.activeElement; state.notes[d.id] = t && t.dataset && t.dataset.k === d.id ? t.value : String(v.note || '');
    }
    saveLocal(); paint();
  }, () => { $('store-state').textContent = '저장소 연결이 끊겼어요. 메모까지 복사로 보내 주세요'; });
})();
</script>
