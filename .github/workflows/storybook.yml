# main에 push하면 Storybook을 빌드해 GitHub Pages에 올린다 (2026-10-17).
# 저장소 Settings → Pages → Source를 "GitHub Actions"로 한 번 켜 둬야 한다.
name: Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0 # eas.json과 같게 (PITFALLS: npm 10은 잠금 파일 검사에서 실패)
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - run: cp -r docs/intro storybook-static/intro # 앱 소개 페이지를 /chagok-app/intro/에 함께 올린다
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
